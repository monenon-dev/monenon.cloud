# 시그마 remote-server — 백엔드 전용 (Ubuntu Docker Engine)
#
# Docker Desktop(Windows) 불필요. 시그마 우분투(WSL) Engine에서만 실행.
# 프론트는 Vercel / 로컬 Next.js — Docker 배포 제외.
#
# 루트 .env 필수:
#   CLOUDFLARE_TUNNEL_TOKEN=<터널 토큰>
#
# 시그마 우분투 (Hub 이미지):
#   bash scripts/phase2-sigma.sh
# 시그마 우분투 (로컬 코드 빌드 — moneyball 등 최신 반영):
#   bash scripts/phase2-sigma-local.sh
#
# pull_policy=missing: 로컬 빌드 후 up 할 때 Hub 옛 이미지로 덮어쓰지 않음.
# Hub 최신이 필요하면 phase2-sigma.sh 가 명시적으로 pull 함.

services:
  backend:
    image: ${BACKEND_IMAGE:-whtjgml2002/monenon-backend:latest}
    pull_policy: missing

  auth:
    image: ${AUTH_IMAGE:-whtjgml2002/monenon-auth:latest}
    pull_policy: missing

  cloudflared:
    depends_on: !override
      backend:
        condition: service_healthy
      auth:
        condition: service_healthy
