# 백엔드 Docker:  docker compose up --build backend
# API 터널:       docker compose --profile tunnel up -d
#                 (루트 .env 에 CLOUDFLARE_TUNNEL_TOKEN 필요 — api.monenon.cloud → backend:8000)
# 프론트엔드:     Docker 배포 제외 (Vercel / 로컬 npm run dev)
# 강사님 흐름: backend Dockerfile + requirements.txt → Hub push → 시그마 Ubuntu Docker Engine
# 접속 PC(네오): scripts/docker-build-push.ps1
# 원격 PC(시그마 우분투 Engine): bash scripts/phase2-sigma.sh
#                (Docker Desktop 불필요 — Windows PowerShell 의 docker 사용 금지)
name: monenoncloud

services:
  backend:
    image: ${BACKEND_IMAGE:-whtjgml2002/monenon-backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # 컨테이너 내부 DB 주소로 Neon URL 덮어쓰기
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-monenon2026}@pgvector:5432/monenon
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-monenon2026}
      REDIS_URL: redis://redis:6379
    depends_on:
      - pgvector
      - neo4j
      - redis
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  n8n:
    profiles: [tunnel]
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: n8n.monenon.cloud
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.monenon.cloud/
      GENERIC_TIMEZONE: Asia/Seoul
      TZ: Asia/Seoul
    volumes:
      - n8n_data:/home/node/.n8n

  # ── Cloudflare Tunnel — API·n8n만 Docker로 노출 (프론트는 Vercel) ─────────────
  # Public Hostname 예:
  #   api.monenon.cloud  → http://backend:8000
  #   n8n.monenon.cloud  → http://n8n:5678
  # monenon.cloud(홈)은 Vercel DNS — 터널에 frontend 넣지 말 것
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in root .env}
    depends_on:
      backend:
        condition: service_healthy
      n8n:
        condition: service_started

  # ── PostgreSQL + pgvector (관계형 DB + 벡터 검색) ────────────────────────────
  pgvector:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monenon2026}
      POSTGRES_DB: monenon
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Redis (캐시 / 세션) ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Neo4j (그래프 DB — star_craft 허브 온톨로지) ──────────────────────────────
  neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"   # Browser UI: http://localhost:7474
      - "7687:7687"   # Bolt 드라이버
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-monenon2026}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-monenon2026} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Qdrant (벡터 DB — 임베딩 검색) ───────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API: http://localhost:6333
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  # ── pgAdmin (PostgreSQL UI) ──────────────────────────────────────────────────
  # UI: http://localhost:5050
  # 로그인: PGADMIN_DEFAULT_EMAIL / PGADMIN_DEFAULT_PASSWORD (기본값 아래 참고)
  # servers.json → 컨테이너 시작 시 "Monenon (pgvector)" 서버 자동 등록
  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-whtjgml2002@naver.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-monenon2026}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro
    depends_on:
      pgvector:
        condition: service_healthy

volumes:
  # 예전 스택(cloudmonenon) n8n 워크플로우 보존 — name 변경 시 새 볼륨 생기지 않도록
  n8n_data:
    external: true
    name: cloudmonenon_n8n_data
  pgvector_data:
  redis_data:
  neo4j_data:
  qdrant_data:
  backend_uploads:
  pgadmin_data:
